server {
  listen 80;

  # Increase allowed upload size for PDF uploads proxied to the backend.
  client_max_body_size 50m;

  # The Azure Easy Auth layer (on this frontend domain) injects a large
  # X-MS-CLIENT-PRINCIPAL header and sets a sizable auth cookie. Enlarge the
  # header buffers so requests carrying them aren't rejected with 400/494.
  large_client_header_buffers 4 32k;

  # Reverse-proxy API calls to the backend Container App.
  #
  # The frontend and backend are deployed as SEPARATE Container Apps on
  # different domains, and Azure's built-in authentication (Easy Auth) is
  # enabled only on THIS (frontend) domain. By routing all /api traffic through
  # here — same origin as the SPA — every API request passes through Easy Auth,
  # which injects the signed-in user's identity headers. We then forward those
  # headers to the backend so it can identify the SSO user (see /login/sso).
  #
  # NOTE: update this host if the backend's domain changes. The SPA must be
  # built WITHOUT VITE_API_URL (relative paths) so it calls /api on this origin.
  location /api/ {
    proxy_pass https://billofladinguatapi.steris.com;
    proxy_http_version 1.1;

    # ACA routes by Host and needs SNI for the upstream TLS handshake, so the
    # Host must be the backend's own hostname (not this frontend's).
    proxy_set_header Host billofladinguatapi.steris.com;
    proxy_ssl_server_name on;

    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Forward the Azure Easy Auth identity headers to the backend. These are
    # injected by the platform on requests to this domain and cannot be set by
    # external clients, so the backend can trust them.
    proxy_set_header X-MS-CLIENT-PRINCIPAL-NAME $http_x_ms_client_principal_name;
    proxy_set_header X-MS-CLIENT-PRINCIPAL-ID   $http_x_ms_client_principal_id;
    proxy_set_header X-MS-CLIENT-PRINCIPAL       $http_x_ms_client_principal;
    proxy_set_header X-MS-CLIENT-PRINCIPAL-IDP   $http_x_ms_client_principal_idp;

    # The forwarded principal header is large; enlarge the upstream buffers.
    proxy_buffer_size 16k;
    proxy_buffers 8 16k;
    proxy_busy_buffers_size 32k;

    proxy_read_timeout 300s;
  }

  location / {
    root /usr/share/nginx/html;
    index index.html index.htm;
    try_files $uri /index.html =404;
  }

  include /etc/nginx/extra-conf.d/*.conf;
}
