server {
  listen 80;

  # Increase allowed upload size for PDF uploads proxied to the backend.
  client_max_body_size 50m;

  # Reverse-proxy API calls to the backend container. In the deployed
  # Azure Container App both containers share localhost, so the FastAPI
  # backend is reachable at localhost:8000. This keeps the whole app on a
  # single origin (no CORS) and lets the frontend call the API via relative
  # paths (e.g. /api/v1/...).
  location /api/ {
    proxy_pass http://localhost:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
  }

  location / {
    root /usr/share/nginx/html;
    index index.html index.htm;
    try_files $uri /index.html =404;
  }

  include /etc/nginx/extra-conf.d/*.conf;
}
