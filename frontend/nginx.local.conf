# LOCAL-ONLY nginx config, mounted over default.conf by compose.local.yml.
#
# It deliberately has NO `location /api/` reverse-proxy block. The prod
# nginx.conf hardcodes proxy_pass to billofladinguatapi.steris.com, and nginx
# refuses to start when that host can't be resolved from inside the container
# ([emerg] host not found in upstream). Locally the SPA is built with
# VITE_API_URL=http://localhost:8000, so it calls the backend directly and never
# needs this container to proxy /api — so we just serve the static files.
server {
  listen 80;

  client_max_body_size 50m;

  location / {
    root /usr/share/nginx/html;
    index index.html index.htm;
    try_files $uri /index.html =404;
  }
}
